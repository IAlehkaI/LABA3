{% extends "base.html" %}
{% block title %}Редактировать новость{% endblock %}
{% block content %}
<a href="/news/{{ news.id }}" class="text-accent hover:underline mb-4 inline-block">← Назад к новости</a>
<h1 class="text-2xl font-bold text-gray-800 mb-6">Редактировать новость</h1>

<div id="error-alert" class="hidden mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
  <span id="error-message"></span>
</div>

<form method="post" enctype="multipart/form-data" class="space-y-4" id="editForm">
  <div>
    <label class="block text-gray-700 mb-1">Заголовок *</label>
    <input type="text" name="title" required minlength="3" maxlength="200"
           class="w-full p-2 border rounded"
           value="{{ news.title }}">
  </div>

  <div>
    <label class="block text-gray-700 mb-1">URL изображения</label>
    <input type="url" name="image_url"
           class="w-full p-2 border rounded"
           value="{{ news.image_url if news.image_url else '' }}">
  </div>

  <div>
    <label class="block text-gray-700 mb-1">Или загрузить новое изображение</label>
    <input type="file" name="image_file" accept="image/*" class="w-full p-2 border rounded">
  </div>

  <div>
    <label class="block text-gray-700 mb-1">Автор *</label>
    <input type="text" name="author" required minlength="2" maxlength="100"
           class="w-full p-2 border rounded"
           value="{{ news.author }}"
           {% if current_user.role != 'admin' %}readonly{% endif %}>
  </div>

  <div>
    <label class="block text-gray-700 mb-1">
      Краткое содержание *
      <span class="text-sm text-gray-500">(минимум 10 символов)</span>
    </label>
    <textarea name="summary" rows="3" required minlength="10" maxlength="500"
              class="w-full p-2 border rounded"
              oninput="updateCharCount('summary', this.value, 10, 500)">{{ news.summary }}</textarea>
    <p class="text-xs text-gray-500 mt-1">
      <span id="summary-count">{{ news.summary|length }}</span>/500 символов (минимум 10)
    </p>
  </div>

  <div>
    <label class="block text-gray-700 mb-1">
      Полный текст *
      <span class="text-sm text-gray-500">(минимум 20 символов)</span>
    </label>
    <textarea name="content" rows="8" required minlength="20"
              class="w-full p-2 border rounded"
              oninput="updateCharCount('content', this.value, 20)">{{ news.content }}</textarea>
    <p class="text-xs text-gray-500 mt-1">
      <span id="content-count">{{ news.content|length }}</span> символов (минимум 20)
    </p>
  </div>

  <div>
    <label class="block text-gray-700 mb-1">Теги (через запятую)</label>
    <input type="text" name="tags"
           class="w-full p-2 border rounded"
           value="{{ news.tags|join(', ') if news.tags else '' }}">
  </div>

  <button type="submit"
          class="bg-accent text-white px-6 py-2 rounded hover:bg-blue-700 transition">
    Сохранить изменения
  </button>
</form>

<script>
  function updateCharCount(fieldName, value, min, max) {
    const counter = document.getElementById(`${fieldName}-count`);
    const length = value.length;
    counter.textContent = length;

    if (length < min) {
      counter.style.color = 'red';
    } else if (max && length > max * 0.9) {
      counter.style.color = 'orange';
    } else {
      counter.style.color = 'green';
    }
  }

  function showError(message) {
    const alert = document.getElementById('error-alert');
    const errorMsg = document.getElementById('error-message');
    errorMsg.textContent = message;
    alert.classList.remove('hidden');
    alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => alert.classList.add('hidden'), 5000);
  }

  document.getElementById('editForm').addEventListener('submit', (e) => {
    const summary = document.querySelector('[name="summary"]').value;
    const content = document.querySelector('[name="content"]').value;

    if (summary.length < 10) {
      e.preventDefault();
      showError('❌ Краткое содержание должно быть не менее 10 символов');
      return false;
    }

    if (content.length < 20) {
      e.preventDefault();
      showError('❌ Полный текст должен быть не менее 20 символов');
      return false;
    }
  });

  // Инициализация счётчиков
  window.addEventListener('load', () => {
    const summary = document.querySelector('[name="summary"]');
    const content = document.querySelector('[name="content"]');
    updateCharCount('summary', summary.value, 10, 500);
    updateCharCount('content', content.value, 20);
  });
</script>
{% endblock %}
