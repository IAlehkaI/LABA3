<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Новостник{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e6ecf7',
                        accent: '#2563eb'
                    },
                    fontFamily: {
                        logo: ['Pacifico', 'cursive'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }
        .role-admin { background: #fee; color: #c33; }
        .role-author { background: #fef3cd; color: #856404; }
        .role-reader { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body class="bg-primary min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="container mx-auto px-4 py-4 max-w-4xl flex items-center justify-between">
            <!-- Иконка профиля слева -->
            <div id="profile-icon" style="visibility: hidden;">
                <a href="/profile" class="flex items-center justify-center w-10 h-10 bg-accent text-white rounded-full hover:bg-blue-700 transition" title="Профиль">
                    <span class="text-xl">👤</span>
                </a>
            </div>

            <!-- Логотип в центре -->
            {% if request.url.path == '/' %}
                <div class="flex-1 text-center">
                    <a href="/" class="inline-block">
                        <span class="text-4xl font-logo text-accent tracking-wide">Новостник</span>
                    </a>
                </div>
            {% else %}
                <div class="flex-1 text-center">
                    <a href="/" class="inline-block">
                        <span class="text-3xl font-logo text-accent">Новостник</span>
                    </a>
                </div>
            {% endif %}

            <!-- Меню пользователя справа -->
            <div class="flex items-center gap-3">
                <div id="user-menu" class="flex items-center gap-3">
                    <a href="/login"
                       class="px-4 py-2 text-sm text-white bg-accent hover:bg-blue-700 rounded font-medium transition">
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-1">
        {% block content %}{% endblock %}
    </main>

    <div id="content-controls"></div>

    <script>
        window.currentUser = null;

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            alert('✅ Вы вышли из системы');
            window.location.href = '/';
        }

        function updateUserInterface() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            const role = localStorage.getItem('role');
            const userMenu = document.getElementById('user-menu');
            const profileIcon = document.getElementById('profile-icon');
            const contentControls = document.getElementById('content-controls');

            if (!token || !username) {
                userMenu.innerHTML = `
                    <a href="/login"
                       class="px-4 py-2 text-sm text-white bg-accent hover:bg-blue-700 rounded font-medium transition">
                        Войти
                    </a>
                `;
                profileIcon.style.visibility = 'hidden';
                return;
            }

            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const expiry = payload.exp * 1000;

                if (Date.now() > expiry) {
                    localStorage.clear();
                    window.location.reload();
                    return;
                }

                window.currentUser = { username, role, token };

                const roleIcons = { admin: '👑', author: '✍️', reader: '👤' };
                const roleLabels = { admin: 'АДМИНИСТРАТОР', author: 'АВТОР', reader: 'ЧИТАТЕЛЬ' };
                const roleClasses = { admin: 'role-admin', author: 'role-author', reader: 'role-reader' };

                userMenu.innerHTML = `
                    <span class="text-sm text-gray-700 font-medium">
                        ${roleIcons[role] || '👤'} ${username}
                        <span class="role-badge ${roleClasses[role]}">${roleLabels[role]}</span>
                    </span>
                    <button onclick="logout()"
                            class="px-3 py-2 text-sm text-white bg-red-500 hover:bg-red-600 rounded transition">
                        Выйти
                    </button>
                `;

                // Показываем иконку профиля если НЕ на странице профиля
                if (window.location.pathname !== '/profile') {
                    profileIcon.style.visibility = 'visible';
                }

                // Кнопка "+" для авторов и админов
                if ((role === 'author' || role === 'admin') && window.location.pathname === '/') {
                    contentControls.innerHTML = `
                        <a href="/create"
                           class="fixed bottom-6 right-6 bg-accent text-white w-14 h-14 rounded-full shadow-2xl hover:bg-blue-700 transition transform hover:scale-110 z-50 flex items-center justify-center text-3xl font-bold"
                           title="Создать новую статью">+</a>
                    `;
                }

            } catch (e) {
                console.error('Ошибка декодирования токена:', e);
                localStorage.clear();
                window.location.reload();
            }
        }

        window.addEventListener('load', updateUserInterface);
    </script>
</body>
</html>
