<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Новостник{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e6ecf7',
                        accent: '#2563eb'
                    },
                    fontFamily: {
                        logo: ['Pacifico', 'cursive'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .dropdown-menu { display: none; }
        .dropdown:hover .dropdown-menu { display: block; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { scrollbar-width: none; }
    </style>
</head>
<body class="bg-primary min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="container mx-auto px-4 py-4 max-w-4xl flex items-center justify-between">
            {% if request.url.path == '/' %}
                <div class="flex-1 text-center">
                    <a href="/" class="inline-block">
                        <span class="text-4xl font-logo text-accent tracking-wide">Новостник</span>
                    </a>
                </div>
            {% else %}
                <div>
                    <a href="/" class="inline-block">
                        <span class="text-3xl font-logo text-accent">Новостник</span>
                    </a>
                </div>
                <div class="flex-1"></div>
            {% endif %}

            <!-- Меню пользователя - БУДЕТ ОБНОВЛЕНО ЧЕРЕЗ JS -->
            <div class="flex items-center gap-3">
                <div id="user-menu" class="flex items-center gap-3">
                    <a href="/login"
                       class="px-4 py-1.5 text-sm text-white bg-accent hover:bg-blue-700 rounded font-medium transition">
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Кнопка "+" для админов - БУДЕТ ПОКАЗАНА ЧЕРЕЗ JS -->
    <div id="admin-controls"></div>

    <script>
        // Глобальные переменные для текущего пользователя
        window.currentUser = null;

        // Функция выхода из профиля
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            alert('✅ Вы вышли из системы');
            window.location.href = '/';
        }

        // Функция обновления UI в зависимости от статуса пользователя
        function updateUserInterface() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            const userMenu = document.getElementById('user-menu');
            const adminControls = document.getElementById('admin-controls');

            if (!token || !username) {
                // Пользователь не авторизован - показываем кнопку "Войти"
                userMenu.innerHTML = `
                    <a href="/login"
                       class="px-4 py-1.5 text-sm text-white bg-accent hover:bg-blue-700 rounded font-medium transition">
                        Войти
                    </a>
                `;
                return;
            }

            try {
                // Декодируем токен
                const payload = JSON.parse(atob(token.split('.')[1]));
                const isAdmin = payload.is_admin || false;

                // Проверяем истечение токена
                const expiry = payload.exp * 1000;
                if (Date.now() > expiry) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('username');
                    window.location.reload();
                    return;
                }

                // Сохраняем данные в глобальную переменную
                window.currentUser = {
                    username: username,
                    isAdmin: isAdmin,
                    token: token
                };

                // Обновляем меню пользователя
                userMenu.innerHTML = `
                    <span class="text-sm text-gray-700 font-medium">
                        👤 ${username}
                        ${isAdmin ? '<span class="ml-1 px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs font-semibold">ADMIN</span>' : ''}
                    </span>
                    <button onclick="logout()"
                            class="px-3 py-1.5 text-sm text-white bg-red-500 hover:bg-red-600 rounded transition">
                        Выйти
                    </button>
                `;

                // Показываем кнопку "+" для админов на главной странице
                if (isAdmin && window.location.pathname === '/') {
                    adminControls.innerHTML = `
                        <a href="/create"
                           class="fixed bottom-6 right-6 bg-accent text-white w-14 h-14 rounded-full shadow-2xl hover:bg-blue-700 transition transform hover:scale-110 z-50 flex items-center justify-center text-3xl font-bold">
                            +
                        </a>
                    `;
                }

            } catch (e) {
                console.error('Ошибка декодирования токена:', e);
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                window.location.reload();
            }
        }

        // Запускаем при загрузке страницы
        window.addEventListener('load', updateUserInterface);
    </script>
</body>
</html>
